<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>

    <link rel="stylesheet" href="css/geral.css" />
  </head>

  <body>
    <!-- APP PRINCIPAL -->
    <section id="app-screen" class="screen hidden">
      <main class="app-main">
        <div class="container">
          <header class="app-header">
            <h1>
              <img src="assets/icons/list-todo.svg" alt="Checklist" />
              TaskFlow
            </h1>
            <div class="user-info">
              <span id="welcome-user"></span>
              <button id="logout-btn" class="logout-button">Sair</button>
            </div>
          </header>

          <form id="taskflowform">
            <input
              type="text"
              id="taskflow"
              class="taskform"
              placeholder="Adicionar nova tarefa..."
              autocomplete="off"
              aria-label="Adicionar nova tarefa"
            />

            <button type="submit" class="task-form-button">Adicionar</button>
          </form>

          <div class="tasks-container">
            <ul id="task-adicionada"></ul>
          </div>
        </div>
      </main>

      <footer class="app-footer">
        <p>TaskFlow &copy; 2026</p>
      </footer>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
